<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PC Store</h1>
    <h2 id="buy">Buy fast or miss out, only one of each!</h2>
    <h3 id="buy">quality over quantity</h3>
    <div class="header-right">
      <button class="cart" id="cart-button">Cart: <span id="cart-count">0</span></button>
    <div id="user-area">
       <button id="auth-btn">Sign in / Sign up</button>
      <button id="admin-add-btn" class="hidden">Add product</button>
      <span id="current-user-banner" class="hidden"></span>
      <button id="signout-btn" class="hidden">Sign out</button>
    </div>

    </div>
  </header>

  <main id="product-list" class="grid"></main>

  <footer>
    <small>Demo PC store — no real purchases.</small>
  </footer>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" id="auth-close">&times;</button>
      <h2 id="auth-title">Sign in</h2>
      <form id="auth-form">
        <input id="auth-username" placeholder="Username" required>
        <input id="auth-password" type="password" placeholder="Password" required>
        <button type="submit" id="auth-submit">Sign in</button>
        <p id="auth-toggle">Don't have an account? <a href="#" id="toggle-link">Create one</a></p>
      </form>
    </div>
  </div>

  <!-- Admin add product modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" id="admin-close">&times;</button>
      <h2>Add product</h2>
      <form id="admin-form">
        <input id="admin-name" placeholder="Product name" required>
        <input id="admin-price" placeholder="Price" type="number" min="1" required>
        <input id="admin-img" placeholder="Image URL (optional)">
        <button type="submit">Add product</button>
      </form>
    </div>
  </div>

  <!-- Cart modal -->
  <div id="cart-modal" class="modal hidden">
    <div class="modal-content cart-modal">
      <button class="close" id="cart-close">&times;</button>
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
        <div class="cart-actions">
          <button id="clear-cart">Clear cart</button>
          <button id="checkout-btn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
